<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GSAP Text Effect 1 Italic</title>
    <style>
      * { box-sizing: border-box; }
      :root { --phone-w: 375px; --phone-h: 816px; --ink: #1f0f08; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, Arial, sans-serif;
      }
      .stage {
        width: min(var(--phone-w), 100vw);
        height: min(var(--phone-h), 100vh);
        display: grid;
        place-items: center;
      }
      .phone {
        position: relative;
        width: var(--phone-w);
        height: var(--phone-h);
        overflow: hidden;
        background: #fff;
      }
      .phone::before {
        content: "";
        position: absolute;
        inset: 0;
        background: url("assets/homepage-bg-15799-15828.png") center / cover no-repeat;
      }
      .copy-lockup {
        position: absolute;
        left: 38px;
        right: 24px;
        top: 650px;
        z-index: 1;
        margin: 0;
        color: var(--ink);
        font-size: 26px;
        font-style: italic;
        font-weight: 900;
        letter-spacing: 0;
        line-height: 1.08;
        filter: drop-shadow(0 3px 0 rgba(255, 255, 255, 0.82));
      }
      .line-mask {
        display: block;
        overflow: hidden;
        white-space: nowrap;
      }
      .line-mask + .line-mask { margin-top: 4px; }
      .word {
        display: inline-block;
        transform-origin: left bottom;
        will-change: transform, opacity, filter;
      }
      @media (max-width: 430px), (max-height: 840px) {
        body { overflow: auto; }
        .phone { transform: scale(min(calc(100vw / 375), calc(100vh / 816))); transform-origin: center; }
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="GSAP masked bounce text animation">
      <section class="phone">
        <h1 class="copy-lockup" aria-label="Catch the latest deals on livestream now">
          <span class="line-mask">
            <span class="word">Catch</span>
            <span class="word">The</span>
            <span class="word">Latest</span>
            <span class="word">Deals</span>
          </span>
          <span class="line-mask">
            <span class="word">On</span>
            <span class="word">Livestream</span>
            <span class="word">Now!</span>
          </span>
        </h1>
      </section>
    </main>
    <script src="assets/gsap.min.js"></script>
    <script>
      const words = gsap.utils.toArray(".word");
      const tl = gsap.timeline({ repeat: -1, repeatDelay: 0.65 });

      tl.set(words, { yPercent: 115, opacity: 0, scale: 0.82, filter: "blur(4px)" })
        .to(words, {
          yPercent: 0,
          opacity: 1,
          scale: 1,
          filter: "blur(0px)",
          duration: 0.74,
          ease: "back.out(1.8)",
          stagger: { each: 0.075, from: "start" }
        })
        .to(words, {
          scale: 1.035,
          duration: 0.22,
          yoyo: true,
          repeat: 1,
          ease: "power1.inOut",
          stagger: { each: 0.018, from: "center" }
        }, "-=0.06")
        .to(words, {
          yPercent: -72,
          opacity: 0,
          filter: "blur(3px)",
          duration: 0.48,
          ease: "power2.in",
          stagger: { each: 0.035, from: "end" }
        }, "+=1.25");
    </script>
  </body>
</html>
