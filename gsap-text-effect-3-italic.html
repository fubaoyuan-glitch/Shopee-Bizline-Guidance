<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GSAP Text Effect 3 Italic</title>
    <style>
      * { box-sizing: border-box; }
      :root { --phone-w: 375px; --phone-h: 816px; --ink: #1f0f08; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, Arial, sans-serif;
      }
      .stage {
        width: min(var(--phone-w), 100vw);
        height: min(var(--phone-h), 100vh);
        display: grid;
        place-items: center;
      }
      .phone {
        position: relative;
        width: var(--phone-w);
        height: var(--phone-h);
        overflow: hidden;
        background: #fff;
      }
      .phone::before {
        content: "";
        position: absolute;
        inset: 0;
        background: url("assets/homepage-bg-15799-15828.png") center / cover no-repeat;
      }
      .copy-lockup {
        position: absolute;
        left: 38px;
        right: 24px;
        top: 650px;
        z-index: 1;
        margin: 0;
        color: var(--ink);
        font-size: 26px;
        font-style: italic;
        font-weight: 900;
        letter-spacing: 0;
        line-height: 1.08;
        filter: drop-shadow(0 3px 0 rgba(255, 255, 255, 0.82));
      }
      .copy-line {
        display: block;
        white-space: nowrap;
      }
      .copy-line + .copy-line { margin-top: 4px; }
      .char,
      .space {
        display: inline-block;
        will-change: transform, opacity, filter;
      }
      .space { width: 0.28em; }
      @media (max-width: 430px), (max-height: 840px) {
        body { overflow: auto; }
        .phone { transform: scale(min(calc(100vw / 375), calc(100vh / 816))); transform-origin: center; }
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="GSAP character wave text animation">
      <section class="phone">
        <h1 class="copy-lockup" aria-label="Catch the latest deals on livestream now">
          <span class="copy-line" data-text="Catch The Latest Deals"></span>
          <span class="copy-line" data-text="On Livestream Now!"></span>
        </h1>
      </section>
    </main>
    <script src="assets/gsap.min.js"></script>
    <script>
      document.querySelectorAll(".copy-line").forEach((line) => {
        line.replaceChildren(
          ...[...line.dataset.text].map((letter) => {
            const span = document.createElement("span");
            span.className = letter === " " ? "space" : "char";
            span.textContent = letter === " " ? "\u00a0" : letter;
            return span;
          })
        );
      });

      const chars = gsap.utils.toArray(".char, .space");
      const tl = gsap.timeline({ repeat: -1, repeatDelay: 0.7 });

      tl.set(chars, { opacity: 0, y: 18, rotationX: -80, scale: 0.92, transformOrigin: "50% 70%", filter: "blur(3px)" })
        .to(chars, {
          opacity: 1,
          y: 0,
          rotationX: 0,
          scale: 1,
          filter: "blur(0px)",
          duration: 0.62,
          ease: "back.out(1.45)",
          stagger: { each: 0.018, from: "start" }
        })
        .to(chars, {
          y: -3,
          duration: 0.18,
          ease: "sine.inOut",
          yoyo: true,
          repeat: 1,
          stagger: { each: 0.012, from: "center" }
        }, "-=0.02")
        .to(chars, {
          opacity: 0,
          y: -14,
          rotationX: 45,
          filter: "blur(2px)",
          duration: 0.42,
          ease: "power2.in",
          stagger: { each: 0.012, from: "end" }
        }, "+=1.25");
    </script>
  </body>
</html>
